version: '3.8'

services:
  # Infrastructure
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Backend Services
  api-gateway:
    build:
      context: ./apps/services/api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - auth
      - product
      - order
      - payment
      - notification
    environment:
      - NODE_ENV=development
      - AUTH_SERVICE_URL=http://auth:3001
      - PRODUCT_SERVICE_URL=http://product:3001
      - ORDER_SERVICE_URL=http://order:3001
      - PAYMENT_SERVICE_URL=http://payment:3001
      - NOTIFICATION_SERVICE_URL=http://notification:3001

  auth:
    build:
      context: ./apps/services/auth
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
      - redis
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/auth
      - REDIS_HOST=redis

  product:
    build:
      context: ./apps/services/product
    ports:
      - "3002:3001"
    depends_on:
      - mongodb
      - redis
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/product
      - REDIS_HOST=redis

  order:
    build:
      context: ./apps/services/order
    ports:
      - "3003:3001"
    depends_on:
      - mongodb
      - kafka
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/order
      - KAFKA_BROKER=kafka:9092

  payment:
    build:
      context: ./apps/services/payment
    ports:
      - "3004:3001"
    depends_on:
      - mongodb
      - kafka
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/payment
      - KAFKA_BROKER=kafka:9092

  notification:
    build:
      context: ./apps/services/notification
    ports:
      - "3005:3001"
    depends_on:
      - mongodb
      - kafka
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/notification
      - KAFKA_BROKER=kafka:9092

  # Frontends
  user-site:
    build:
      context: ./apps/user-site
    ports:
      - "3006:3000"
    depends_on:
      - api-gateway
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000

  admin-panel:
    build:
      context: ./apps/admin-panel
    ports:
      - "3007:80"
    depends_on:
      - api-gateway
    environment:
      - REACT_APP_API_URL=http://localhost:3000

volumes:
  mongodb_data:
