openapi: 3.0.0
info:
  title: Product Service
  version: 1.0.0
  description: Product Catalog and Inventory Management Service
paths:
  /api/v1/products:
    get:
      summary: List all products
      tags: [Product]
      responses:
        '200':
          description: A list of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
    post:
      summary: Create a new product (Admin only)
      tags: [Product]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
  /api/v1/products/{id}:
    get:
      summary: Get product details
      tags: [Product]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
    put:
      summary: Update product (Admin only)
      tags: [Product]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
    delete:
      summary: Delete product (Admin only)
      tags: [Product]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Product deleted

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ProductListResponse:
      type: array
      items:
        $ref: '#/components/schemas/Product'
    ProductResponse:
      $ref: '#/components/schemas/Product'
    ProductCreateRequest:
      type: object
      required: [name, price, currency, stock, categoryId]
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: number }
        currency: { type: string }
        stock: { type: integer }
        categoryId: { type: string }
        images: { type: array, items: { type: string } }
    ProductUpdateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: number }
        currency: { type: string }
        stock: { type: integer }
        categoryId: { type: string }
        images: { type: array, items: { type: string } }
    Product:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        currency: { type: string }
        stock: { type: integer }
        categoryId: { type: string }
        images: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
