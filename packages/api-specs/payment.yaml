openapi: 3.0.0
info:
  title: Payment Service
  version: 1.0.0
  description: Payment Processing and Gateway Integration Service
paths:
  /api/v1/payments/create:
    post:
      summary: Create a payment session
      tags: [Payment]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSessionResponse'
  /api/v1/payments/webhook:
    post:
      summary: Handle Razorpay webhooks
      tags: [Payment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RazorpayWebhookPayload'
      responses:
        '200':
          description: Webhook processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
  /api/v1/payments/{id}:
    get:
      summary: Get payment details
      tags: [Payment]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Payment details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PaymentRequest:
      type: object
      required: [orderId, amount, currency]
      properties:
        orderId: { type: string }
        amount: { type: number }
        currency: { type: string }
    PaymentSessionResponse:
      type: object
      properties:
        paymentId: { type: string }
        amount: { type: number }
        currency: { type: string }
        orderId: { type: string }
        razorpayOrderId: { type: string }
        razorpayPaymentId: { type: string }
        method: { type: string }
    RazorpayWebhookPayload:
      type: object
      properties:
        event: { type: string }
        payload:
          type: object
          properties:
            payment: { type: object }
            order: { type: object }
    WebhookResponse:
      type: object
      properties:
        status: { type: string }
    PaymentResponse:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        amount: { type: number }
        currency: { type: string }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED, REFUNDED] }
        transactionId: { type: string }
        createdAt: { type: string, format: date-time }
